name: release

# On every human push to main: cross-compile all 6 binaries, bump the patch
# version, and commit the result in one push. That publishes a new version to
# installers (which pull via autoUpdate). The bot's own commit is skipped
# (actor guard + [skip ci]) so it never loops.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/mermaid-inline/src/go.mod

      - name: Cross-compile all targets
        working-directory: plugins/mermaid-inline/src
        run: |
          set -euo pipefail
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${t%/*}"; arch="${t#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "../bin/mermaid-hook_${os}_${arch}${ext}" .
          done

      - name: Bump patch version
        run: |
          set -euo pipefail
          f=plugins/mermaid-inline/.claude-plugin/plugin.json
          cur=$(jq -r '.version // "0.0.0"' "$f")
          IFS=. read -r a b c <<< "$cur"
          new="$a.$b.$((c + 1))"
          tmp=$(mktemp); jq --arg v "$new" '.version = $v' "$f" > "$tmp" && mv "$tmp" "$f"
          echo "VERSION=$new" >> "$GITHUB_ENV"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "release: v${VERSION} [skip ci]"
            git push
          fi
